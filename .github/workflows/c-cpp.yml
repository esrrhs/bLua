name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  linux-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        lua_version: ["5.1", "5.2", "5.3", "5.4"]

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        pkg="liblua${{ matrix.lua_version }}-dev"
        if [ "${{ matrix.lua_version }}" = "5.1" ]; then pkg=liblua5.1-0-dev; fi
        sudo apt-get install -y "$pkg"

    - name: Configure CMake
      env:
        CC: ${{ matrix.compiler == 'gcc' && 'gcc' || 'clang' }}
        CXX: ${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }}
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBLUA_BUILD_TESTS=ON \
          -DLUA_INCLUDE_DIR=/usr/include/lua${{ matrix.lua_version }} \
          -DLUA_LIBRARY=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/liblua${{ matrix.lua_version }}.so

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure -C Release

  linux-luajit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install LuaJIT
      run: |
        sudo apt-get update
        sudo apt-get install -y libluajit-5.1-dev pkg-config

    - name: Configure CMake
      run: |
        LUA_INC=$(pkg-config --cflags-only-I luajit | awk '{print substr($1,3)}')
        LUA_LIBDIR=$(pkg-config --variable=libdir luajit)
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBLUA_BUILD_TESTS=ON \
          -DLUA_INCLUDE_DIR="${LUA_INC}" \
          -DLUA_LIBRARY="${LUA_LIBDIR}/libluajit-5.1.so"

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure -C Release

  macos-build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        brew install lua

    - name: Configure CMake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBLUA_BUILD_TESTS=ON

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure -C Release

  windows-build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Checkout pinned official Lua 5.4.7 sources
      uses: actions/checkout@v4
      with:
        repository: lua/lua
        ref: 1ab3208a1fceb12fca8f24ba57d6e13c5bff15e3
        path: .ci-deps/lua
        persist-credentials: false

    - name: Build external Lua with MSVC
      shell: pwsh
      run: |
        cmake -S test/lua-runtime -B build-lua "-DLUA_SOURCE_DIR=$pwd/.ci-deps/lua"
        cmake --build build-lua --config Release --parallel
        cmake --install build-lua --config Release --prefix "$pwd/.ci-deps/lua-install"

    - name: Configure CMake
      shell: pwsh
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBLUA_BUILD_TESTS=ON `
          "-DLUA_INCLUDE_DIR=$pwd/.ci-deps/lua-install/include" `
          "-DLUA_LIBRARY=$pwd/.ci-deps/lua-install/lib/lua.lib"

    - name: Build
      run: |
        cmake --build build --config Release

    - name: Run Tests
      run: |
        ctest --test-dir build --output-on-failure -C Release

  linux-debug:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizers: ["OFF", "ON"]
    steps:
    - uses: actions/checkout@v4
    - name: Install Lua
      run: |
        sudo apt-get update
        sudo apt-get install -y liblua5.4-dev
    - name: Configure Debug
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Debug -DBLUA_ENABLE_SANITIZERS=${{ matrix.sanitizers }} \
          -DLUA_INCLUDE_DIR=/usr/include/lua5.4 \
          -DLUA_LIBRARY=/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/liblua5.4.so
    - name: Build
      run: cmake --build build --parallel
    - name: Test (including failure checks and relocated consumer)
      env:
        ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
        UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      run: ctest --test-dir build --output-on-failure
